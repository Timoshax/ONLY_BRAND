{% extends 'products/base.html' %}

{% block title %}Заказ оформлен | ONLY BRAND{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-success mb-3">✓</div>
    <h1 class="fw-bold">Спасибо за заказ!</h1>
    <p class="fs-5 text-muted">Ваш заказ <strong>#{{ order.id }}</strong> успешно создан.</p>
    <p class="text-muted">Мы свяжемся с вами по email ({{ order.email }}) для подтверждения доставки.</p>
    <a href="{% url 'product_list' %}" class="btn btn-dark btn-lg mt-3">Вернуться на главную</a>
</div>
{% endblock %}
