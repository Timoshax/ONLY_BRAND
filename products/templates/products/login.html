{% extends 'products/base.html' %}

{% block title %}Вход | ONLY BRAND{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Вход в аккаунт</h3>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            <input type="{{ field.field.widget.input_type }}" 
                                   name="{{ field.name }}" 
                                   class="form-control" 
                                   required>
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-dark w-100 mt-3">Войти</button>
                </form>
                <div class="text-center mt-3">
                    <small>Ещё нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
