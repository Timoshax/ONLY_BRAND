<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ONLY BRAND{% endblock %}</title>
    <!-- Подключаем стили Bootstrap по ссылке -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <!-- Логотип сайта (ссылка на главную) -->
        <a class="navbar-brand fw-bold" href="{% url 'product_list' %}">ONLY BRAND</a>

        <!-- Правая часть меню -->
        <div class="d-flex align-items-center gap-3 ms-auto">
            {% if user.is_authenticated %}
                <span class="text-light">Привет, <strong>{{ user.username }}</strong>!</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Войти</a>
                <a href="{% url 'register' %}" class="btn btn-light btn-sm">Регистрация</a>
            {% endif %}

            <!-- Кнопка корзины всегда под рукой -->
            <a href="{% url 'cart_detail' %}" class="btn btn-warning btn-sm">
                🛒 Корзина
            </a>
        </div>
    </div>
</nav>

    <!-- Основной контейнер, куда будут вставляться другие страницы -->
    <div class="container">
        {% block content %}
        <!-- Здесь будет содержимое страницы каталога или товара -->
        {% endblock %}
    </div>

</body>
</html>
