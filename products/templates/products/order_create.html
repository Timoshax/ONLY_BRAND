{% extends 'products/base.html' %}

{% block title %}Оформление заказа | ONLY BRAND{% endblock %}

{% block content %}
<h2 class="mb-4">Оформление заказа</h2>

<div class="row">
    <!-- Форма с данными покупателя -->
    <div class="col-md-7">
        <div class="card p-4 shadow-sm mb-4">
            <h4 class="mb-3">Адрес доставки</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Имя</label>
                        {{ form.first_name }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Фамилия</label>
                        {{ form.last_name }}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    {{ form.email }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Адрес доставки</label>
                    {{ form.address }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Город</label>
                    {{ form.city }}
                </div>
                <button type="submit" class="btn btn-dark btn-lg w-100 mt-3">Подтвердить заказ</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
